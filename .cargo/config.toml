[alias]
fmt-check = "fmt --all --check"
lint = "clippy --workspace --all-targets -- -D warnings"
tests = "test --workspace"
cov-clean = "llvm-cov clean --workspace"
cov-run = "llvm-cov --workspace --no-report"
cov-check-core = "llvm-cov report -p gb-core --summary-only --fail-under-lines 96.00 --fail-under-regions 95.95 --fail-under-functions 98.43"
cov-check-test-runner = "llvm-cov report -p gb-test-runner --summary-only --fail-under-lines 84.22 --fail-under-regions 84.63 --fail-under-functions 78.87"
cov-check-persistence = "llvm-cov report -p gb-persistence --summary-only --fail-under-lines 96.66 --fail-under-regions 91.93 --fail-under-functions 94.68"
cov-check-cli = "llvm-cov report -p gb-cli --summary-only --fail-under-lines 92.52 --fail-under-regions 90.01 --fail-under-functions 92.30"
cov-check-desktop = "llvm-cov report -p gb-desktop --summary-only --fail-under-lines 93.35 --fail-under-regions 93.40 --fail-under-functions 94.76"
cov-html = "llvm-cov --workspace --html"
deny-check = "deny check"
