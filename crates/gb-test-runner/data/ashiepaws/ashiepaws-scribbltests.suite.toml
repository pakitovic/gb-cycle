[[case]]
id = "ashiepaws-scribbltests-fairylake"
rom = "fairylake/fairylake.gb"
disabled = true
comment = "Disabled because c-sp v7.0 does not ship a single-frame PNG fixture for this WIP demo-style ROM."

[[case]]
id = "ashiepaws-scribbltests-statcount"
rom = "statcount/statcount.gb"
disabled = true
comment = "Disabled because this interactive ROM has no direct PNG pass fixture in the c-sp v7.0 archive; statcount-auto provides the automated oracle."

[[case]]
id = "ashiepaws-scribbltests-winpos"
rom = "winpos/winpos.gb"
