family = "scribbltests"
suite_name = "ashiepaws-scribbltests"
report = "ashiepaws"
model = "dmg"
timeout_frames = 180
report_model_suffix = true
oracle = { type = "framebuffer", mode = "until-match" }

[[case]]
id = "ashiepaws-scribbltests-lycscx-dmg"
rom = "lycscx/lycscx.gb"
oracle = { fixture = "lycscx/lycscx-cgb-dmg.png" }

[[case]]
id = "ashiepaws-scribbltests-lycscx-cgb"
rom = "lycscx/lycscx.gb"
model = "cgb"
revision = "cpu-cgb-d"
startup = "real-boot"
oracle = { type = "framebuffer", mode = "until-match", source = "cgb", fixture = "lycscx/lycscx-cgb-dmg.png" }

