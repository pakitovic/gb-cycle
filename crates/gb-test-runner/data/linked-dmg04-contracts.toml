suite_name = "linked-dmg04-contracts"
family = "serial-ext"

[[session]]
id = "dmg04-left-serial-hex"
topology = "dmg04"
timeout_tcycles = 5000
oracle = "linked-participant-serial-hex-exact"
target_participant = "left"
expected = "A5"

  [[session.participant]]
  id = "left"
  rom = "linked/fixtures/dmg04/basic-left.gb"
  console = "dmg"

  [[session.participant]]
  id = "right"
  rom = "linked/fixtures/dmg04/basic-right.gb"
  console = "dmg"

