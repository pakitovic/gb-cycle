[[case]]
id = "age-m3-bg-bgp-ncm-c"
rom = "m3-bg-bgp.gb"
model = "cgb"
revision = "cpu-cgb-c"
oracle = { source = "cgb", fixture = "m3-bg-bgp-ncmBC.png" }

[[case]]
id = "age-m3-bg-bgp-ncm-e"
rom = "m3-bg-bgp.gb"
model = "cgb"
