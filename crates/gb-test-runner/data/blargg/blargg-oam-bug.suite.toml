family = "oam_bug"
suite_name = "blargg-oam-bug"
report = "blargg"
model = "dmg"
timeout_frames = 1200
oracle = { type = "framebuffer", mode = "until-match" }

[[case]]
id = "blargg-oam-bug-multi"
rom = "oam_bug.gb"
timeout_frames = 1500
oracle = { projection = "grayscale", compare = "grayscale-tolerance", tolerance = 2, fixture = "oam_bug-dmg.png" }

