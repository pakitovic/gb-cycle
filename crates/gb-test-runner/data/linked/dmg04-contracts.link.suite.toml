report = "linked"
suite_name = "dmg04-contracts"
family = "linked"
topology = "dmg04"
timeout_tcycles = 5000

[[case]]
id = "dmg04-left-serial-hex"
oracle = { type = "serial-hex-exact", target_participant = "left", expected = "A5" }

  [[case.participant]]
  id = "left"
  rom = "fixtures/dmg04/basic-left.gb"
  console = "dmg"

  [[case.participant]]
  id = "right"
  rom = "fixtures/dmg04/basic-right.gb"
  console = "dmg"

[[case]]
id = "dmg04-right-serial-hex"
oracle = { type = "serial-hex-exact", target_participant = "right", expected = "3C" }

  [[case.participant]]
  id = "left"
  rom = "fixtures/dmg04/basic-left.gb"
  console = "dmg"

  [[case.participant]]
  id = "right"
  rom = "fixtures/dmg04/basic-right.gb"
  console = "dmg"

