family = "blargg"
suite_name = "blargg-timing-memory-oam"
console = "dmg"
timeout_frames = 1200
oracle = { type = "framebuffer", mode = "until-match" }

[[case]]
id = "blargg-halt-bug"
rom = "halt_bug.gb"
execution_mode = "permissive"
oracle = { fixture = "halt_bug.png" }

[[case]]
id = "blargg-instr-timing"
rom = "instr_timing.gb"
oracle = { type = "serial-contains", expected = "Passed" }

[[case]]
id = "blargg-interrupt-time"
rom = "interrupt_time.gb"
console = "cgb"
execution_mode = "permissive"
timeout_frames = 1200
oracle = { source = "cgb", fixture = "interrupt_time.png" }

[[case]]
id = "blargg-mem-timing-01-read-timing"
