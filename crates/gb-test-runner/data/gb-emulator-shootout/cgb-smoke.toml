suite_name = "cgb-smoke"

[[case]]
family = "mooneye"
id = "cgb-smoke-boot-regs-cgb"
rom = "misc/boot_regs-cgb.gb"
console = "cgb"
timeout_frames = 180
oracle = "mooneye-result"

[[case]]
family = "acid"
id = "cgb-smoke-which-gbc"
rom = "which.gb"
console = "cgb"
report_model_suffix = true
timeout_frames = 180
oracle = "info-framebuffer"
