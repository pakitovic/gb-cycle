[package]
name = "gb-desktop"
version = "0.2.1"
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"

[features]
default = []
sdl3-build-from-source = ["sdl3/build-from-source"]

[dependencies]
gb-benchmark = { version = "0.2.1", path = "../gb-benchmark" }
gb-core = { version = "0.2.1", path = "../gb-core" }
gb-persistence = { version = "0.2.1", path = "../gb-persistence" }
sdl3 = { version = "0.18.4", features = ["use-pkg-config", "hidapi"] }
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.11.0"
toml = "1.1.2"
png = "0.18"

[dev-dependencies]
sdl3 = { version = "0.18.4", features = ["use-pkg-config", "hidapi", "test-mode"] }
