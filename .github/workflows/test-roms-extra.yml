name: test-roms-extra

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-roms-extra:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ax6
            command: make run-ax6
          - name: samesuite
            command: make run-samesuite
          - name: little-things-gb
            command: make run-little-things-gb
          - name: gbmicrotest
            command: make run-gbmicrotest
          - name: cgb-boot-hwio
            command: make run-cgb-boot-hwio
          - name: mooneye-cgb
            command: make run-mooneye-cgb
          - name: samesuite-cgb
            command: make run-samesuite-cgb
          - name: magen-cgb
            command: make run-magen-cgb
          - name: mealybug-cgb
            command: make run-mealybug-cgb
          - name: little-things-gb-cgb
            command: make run-little-things-gb-cgb

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run ${{ matrix.name }} ROM suite
        run: ${{ matrix.command }}
