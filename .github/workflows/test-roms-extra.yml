name: test-roms-extra

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  test-roms-extra:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ax6
          # Temporarily disabled while the standalone SameSuite v7 report is imported and baselined.
          # - name: samesuite
          - name: little-things-gb
          - name: magen
          # Temporarily disabled while the c-sp v7 Mealybug inventory is validated manually.
          # - name: mealybug-tearoom-tests
          - name: gbmicrotest
          - name: mooneye
          - name: wilbertpol
          - name: blargg

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run ${{ matrix.name }} ROM suite
        run: cargo rom-suite ${{ matrix.name }}
