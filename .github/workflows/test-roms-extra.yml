name: test-roms-extra

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  test-roms-extra:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ax6-dmg
            report: ax6
          - name: samesuite-dmg
            report: samesuite
          - name: little-things-gb-dmg
            report: little-things-gb
          - name: mooneye-sgb
            report: mooneye
          - name: mooneye-cgb
            report: mooneye
          - name: samesuite-cgb
            report: samesuite
          - name: magen-cgb
            report: magen
          - name: mealybug-tearoom-tests-cgb
            report: mealybug-tearoom-tests
          - name: little-things-gb-cgb
            report: little-things-gb

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run ${{ matrix.name }} ROM suite
        run: cargo rom-suite ${{ matrix.report }} --suite ${{ matrix.name }}
