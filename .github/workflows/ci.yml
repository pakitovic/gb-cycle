name: ci

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

env:
  LINUX_DESKTOP_FEATURES: gb-desktop/sdl3-build-from-source
  SDL3_BUILD_DEPENDENCIES: >-
    libasound2-dev
    libdbus-1-dev
    libdecor-0-dev
    libdrm-dev
    libegl1-mesa-dev
    libgbm-dev
    libgl1-mesa-dev
    libgles2-mesa-dev
    libibus-1.0-dev
    libpipewire-0.3-dev
    libpulse-dev
    libudev-dev
    libwayland-dev
    libx11-dev
    libxcursor-dev
    libxext-dev
    libxfixes-dev
    libxi-dev
    libxkbcommon-dev
    libxrandr-dev
    libxss-dev
    libxtst-dev
    liburing-dev
    wayland-protocols

jobs:
  checks:
    name: checks (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Format
            components: rustfmt
          - name: Lint
            components: clippy
          - name: Typos
            components: ''
          - name: Deny
            components: ''

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install SDL3 build dependencies
        if: matrix.name == 'Lint'
        run: |
          read -r -a sdl3_build_dependencies <<< "${SDL3_BUILD_DEPENDENCIES}"
          sudo apt-get update
          sudo apt-get install -y "${sdl3_build_dependencies[@]}"

      - name: Setup Rust
        if: matrix.components != ''
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: ${{ matrix.components }}

      - name: Setup Rust
        if: matrix.components == ''
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-deny
        if: matrix.name == 'Deny'
        uses: taiki-e/install-action@v2.85.5
        with:
          tool: cargo-deny

      - name: Install typos-cli
        if: matrix.name == 'Typos'
        uses: taiki-e/install-action@v2.85.5
        with:
          tool: typos-cli

      - name: Format
        if: matrix.name == 'Format'
        run: cargo fmt-check

      - name: Lint
        if: matrix.name == 'Lint'
        run: cargo clippy --workspace --all-targets --features "${LINUX_DESKTOP_FEATURES}" -- -D warnings

      - name: Typos
        if: matrix.name == 'Typos'
        run: typos

      - name: Deny
        if: matrix.name == 'Deny'
        run: cargo deny-check

  coverage:
    name: coverage (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: gb-core
            check: cov-check-core
          - package: gb-test-runner
            check: cov-check-test-runner
          - package: gb-benchmark
            check: cov-check-benchmark
          - package: gb-persistence
            check: cov-check-persistence
          - package: gb-cli
            check: cov-check-cli
          - package: gb-desktop
            check: cov-check-desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install SDL3 build dependencies
        if: matrix.package == 'gb-desktop'
        run: |
          read -r -a sdl3_build_dependencies <<< "${SDL3_BUILD_DEPENDENCIES}"
          sudo apt-get update
          sudo apt-get install -y "${sdl3_build_dependencies[@]}"

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: llvm-tools

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2.85.5
        with:
          tool: cargo-llvm-cov

      - name: Coverage clean
        run: cargo llvm-cov clean --workspace

      - name: Coverage run
        if: matrix.package != 'gb-desktop'
        run: cargo llvm-cov -p "${{ matrix.package }}" --no-report

      - name: Coverage run desktop
        if: matrix.package == 'gb-desktop'
        run: cargo llvm-cov -p gb-desktop --features "${LINUX_DESKTOP_FEATURES}" --no-report

      - name: Coverage gate
        run: cargo ${{ matrix.check }}
