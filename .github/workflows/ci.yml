name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy, llvm-tools

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Install typos-cli
        uses: taiki-e/install-action@v2
        with:
          tool: typos-cli

      - name: Setup SDL3
        id: sdl
        uses: libsdl-org/setup-sdl@v1
        with:
          version: 3-latest
          install-linux-dependencies: true
          add-to-environment: true

      - name: Export SDL3 pkg-config path
        run: |
          echo "PKG_CONFIG_PATH=${{ steps.sdl.outputs.prefix }}/lib/pkgconfig:${{ steps.sdl.outputs.prefix }}/lib64/pkgconfig:${{ steps.sdl.outputs.prefix }}/share/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=${{ steps.sdl.outputs.prefix }}/lib:${{ steps.sdl.outputs.prefix }}/lib64${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Format
        run: cargo fmt-check

      - name: Lint
        run: cargo lint

      - name: Tests
        run: cargo tests

      - name: Typos
        run: typos

      - name: Deny
        run: cargo deny-check

      - name: Coverage
        run: cargo cov-check
