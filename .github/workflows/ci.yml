name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      LINUX_DESKTOP_FEATURES: gb-desktop/sdl3-build-from-source

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install SDL3 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libdbus-1-dev \
            libdecor-0-dev \
            libdrm-dev \
            libegl1-mesa-dev \
            libgbm-dev \
            libgl1-mesa-dev \
            libgles2-mesa-dev \
            libibus-1.0-dev \
            libpipewire-0.3-dev \
            libpulse-dev \
            libudev-dev \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxext-dev \
            libxfixes-dev \
            libxi-dev \
            libxkbcommon-dev \
            libxrandr-dev \
            libxss-dev \
            libxtst-dev \
            liburing-dev \
            wayland-protocols

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy, llvm-tools

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Install typos-cli
        uses: taiki-e/install-action@v2
        with:
          tool: typos-cli

      - name: Format
        run: cargo fmt-check

      - name: Lint
        run: cargo clippy --workspace --all-targets --features "${LINUX_DESKTOP_FEATURES}" -- -D warnings

      - name: Coverage run
        run: cargo cov-run --features "${LINUX_DESKTOP_FEATURES}"

      - name: Typos
        run: typos

      - name: Deny
        run: cargo deny-check

      - name: Coverage gate
        shell: bash
        run: |
          set -uo pipefail

          checks=(
            core
            test-runner
            persistence
            cli
            desktop
          )

          log_dir="${RUNNER_TEMP:-${TMPDIR:-/tmp}}"
          pids=()
          names=()

          for check in "${checks[@]}"; do
            log="${log_dir}/cov-check-${check}.log"
            cargo "cov-check-${check}" >"${log}" 2>&1 &
            pids+=("$!")
            names+=("${check}")
          done

          exit_code=0

          for i in "${!pids[@]}"; do
            name="${names[$i]}"
            log="${log_dir}/cov-check-${name}.log"

            if wait "${pids[$i]}"; then
              result=0
            else
              result=$?
              exit_code=1
            fi

            echo "::group::Coverage gate: ${name}"
            cat "${log}"
            echo "::endgroup::"

            if [ "${result}" -ne 0 ]; then
              echo "::error title=Coverage gate failed::cargo cov-check-${name} exited with ${result}"
            fi
          done

          exit "${exit_code}"
