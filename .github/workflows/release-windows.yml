name: release-windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build desktop release
        run: cargo build --profile release-max -p gb-desktop --features gb-desktop/sdl3-build-from-source

      - name: Package Windows binary
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $packageName = "gb-cycle-windows-x86_64"
          $packageDir = Join-Path "dist" $packageName
          $zipPath = Join-Path "dist" "$packageName.zip"

          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null
          Copy-Item -Path "target\release-max\gb-desktop.exe" -Destination $packageDir -Force
          Copy-Item -Path "README.md", "LICENSE-MIT", "LICENSE-APACHE" -Destination $packageDir -Force

          $packageDlls = @(
            Get-ChildItem -Path "target\release-max" -Recurse -Filter "*.dll" -File |
            Sort-Object -Property FullName -Unique
          )
          if ($packageDlls.Count -gt 0) {
            $packageDlls | Copy-Item -Destination $packageDir -Force
          }

          & (Join-Path $packageDir "gb-desktop.exe") --help

          Compress-Archive -Path (Join-Path $packageDir "*") -DestinationPath $zipPath -Force

      - name: Upload Windows package artifact
        uses: actions/upload-artifact@v7
        with:
          name: gb-cycle-windows-x86_64
          path: dist/gb-cycle-windows-x86_64.zip

      - name: Upload Windows package release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/gb-cycle-windows-x86_64.zip
