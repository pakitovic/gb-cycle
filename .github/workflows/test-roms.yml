name: test-roms

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  test-roms:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: acid
          - name: blargg-cpu-instrs
          - name: blargg-dmg-sound
          - name: blargg-timing-memory-oam
          - name: daid
          - name: ashiepaws
          - name: cpp
          - name: samesuite
          - name: mooneye-acceptance-manual-misc
          - name: mooneye-emulator-mbc1-mbc5
          - name: mooneye-emulator-mbc2
          - name: mealybug-tearoom-tests
          - name: blargg-cgb-sound
          - name: samesuite-apu
          - name: ax6

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run ${{ matrix.name }} ROM suite
        run: cargo rom-suite gb-emulator-shootout --suite ${{ matrix.name }}
