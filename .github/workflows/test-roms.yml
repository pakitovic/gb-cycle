name: test-roms

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-roms:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: acid
            command: make run-acid
          - name: blargg-cpu-instrs
            command: make run-blargg-cpu-instrs
          - name: blargg-dmg-sound
            command: make run-blargg-dmg-sound
          - name: blargg-timing-memory-oam
            command: make run-blargg-timing-memory-oam
          - name: daid
            command: make run-daid
          - name: hacktix
            command: make run-hacktix
          - name: cpp
            command: make run-cpp
          - name: mooneye-acceptance
            command: make run-mooneye-acceptance
          - name: mooneye-mbc1-mbc5
            command: make run-mooneye-mbc1-mbc5
          - name: mooneye-mbc2
            command: make run-mooneye-mbc2
          - name: mealybug
            command: make run-mealybug
          - name: cgb-smoke
            command: make run-cgb-smoke
          - name: cgb-boot-div
            command: make run-cgb-boot-div
          - name: cgb-speed
            command: make run-cgb-speed
          - name: cgb-ppu-basic
            command: make run-cgb-ppu-basic
          - name: cgb-ppu-hard
            command: make run-cgb-ppu-hard
          - name: cgb-dma
            command: make run-cgb-dma
          - name: cgb-audio-blargg
            command: make run-cgb-audio-blargg
          - name: cgb-audio-samesuite
            command: make run-cgb-audio-samesuite
          - name: cgb-rtc
            command: make run-cgb-rtc

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run ${{ matrix.name }} ROM suite
        run: ${{ matrix.command }}
