name: test-roms

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  test-roms:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: acid
            command: make run-acid
          - name: blargg-cpu-instrs
            command: make run-blargg-cpu-instrs
          - name: blargg-dmg-sound
            command: make run-blargg-dmg-sound
          - name: blargg-timing-memory-oam
            command: make run-blargg-timing-memory-oam
          - name: daid
            command: make run-daid
          - name: ashiepaws
            command: make run-ashiepaws
          - name: cpp
            command: make run-cpp
          - name: samesuite
            command: make run-samesuite
          - name: mooneye-acceptance
            command: make run-mooneye-acceptance
          - name: mooneye-mbc1-mbc5
            command: make run-mooneye-mbc1-mbc5
          - name: mooneye-mbc2
            command: make run-mooneye-mbc2
          - name: mealybug
            command: make run-mealybug
          - name: blargg-cgb-sound
            command: make run-blargg-cgb-sound
          - name: samesuite-apu
            command: make run-samesuite-apu
          - name: ax6
            command: make run-ax6-cgb

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run ${{ matrix.name }} ROM suite
        run: ${{ matrix.command }}
