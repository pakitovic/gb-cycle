name: test-roms

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  acid:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run Acid ROM suite
        run: make run-acid

