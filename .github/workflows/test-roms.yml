name: test-roms

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  test-roms:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: acid
            family: acid
            suite: acid
          - name: blargg-cpu-instrs
            family: blargg
            suite: blargg-cpu-instrs
          - name: blargg-dmg-sound
            family: blargg
            suite: blargg-dmg-sound
          - name: blargg-timing-memory-oam
            family: blargg
            suite: blargg-timing-memory-oam
          - name: daid
            family: daid
            suite: daid
          - name: ashiepaws
            family: ashiepaws
            suite: ashiepaws
          - name: cpp
            family: cpp
            suite: cpp
          - name: samesuite
            family: samesuite
            suite: samesuite
          - name: mooneye-acceptance
            family: mooneye
            suite: mooneye-acceptance-manual-misc
          - name: mooneye-mbc1-mbc5
            family: mooneye
            suite: mooneye-emulator-mbc1-mbc5
          - name: mooneye-mbc2
            family: mooneye
            suite: mooneye-emulator-mbc2
          - name: mealybug
            family: mealybug-tearoom-tests
            suite: mealybug-tearoom-tests
          - name: blargg-cgb-sound
            family: blargg
            suite: blargg-cgb-sound
          - name: samesuite-apu
            family: samesuite
            suite: samesuite-apu
          - name: ax6
            family: ax6
            suite: ax6

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Fetch ${{ matrix.name }} ROMs
        run: cargo rom-fetch gb-emulator-shootout ${{ matrix.family }}

      - name: Run ${{ matrix.name }} ROM suite
        run: cargo rom-suite gb-emulator-shootout --suite ${{ matrix.suite }}
