name: test-roms

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  dmg-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run supported external DMG suites
        run: make test-roms
