name: test-roms

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-roms:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: acid
            command: make run-acid
          - name: blargg
            command: make run-blargg
          - name: daid
            command: make run-daid
          - name: hacktix
            command: make run-hacktix
          - name: cpp
            command: make run-cpp
          - name: mooneye-acceptance
            command: make run-mooneye-acceptance
          - name: mooneye-mbc1-mbc5
            command: make run-mooneye-mbc1-mbc5
          - name: mooneye-mbc2
            command: make run-mooneye-mbc2
          - name: mealybug
            command: make run-mealybug

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run ${{ matrix.name }} ROM suite
        run: ${{ matrix.command }}
