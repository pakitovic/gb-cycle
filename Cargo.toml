[workspace]
members = [
    "crates/gb-core",
    "crates/gb-test-runner",
    "crates/gb-cli",
    "crates/gb-persistence",
    "crates/gb-desktop",
]
resolver = "2"

[profile.release-max]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.bench]
debug = true
